name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: wardex
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Don't pollute the cache with ephemeral PR-branch builds. Only
          # canonical pushes to main / release branches populate Cachix —
          # PRs read from it but don't write.
          skipPush: ${{ github.event_name != 'push' }}

      # Always: fmt + clippy + cargo test. Cheap (~2 min on warm cache);
      # gives fast feedback on PRs without compiling the full dep graph
      # inside the Nix sandbox.
      - run: nix develop --command bash -c 'cargo fmt --check'
      - run: nix develop --command bash -c 'cargo clippy --all-targets --all-features -- -D warnings'
      - run: nix develop --command bash -c 'cargo test'

      # Main / release only: full flake build that re-runs tests in the
      # sandbox and publishes cargoArtifacts + the wardex derivation to
      # Cachix. PRs skip this to keep iteration cheap.
      - if: github.event_name == 'push'
        run: nix flake check -L
      - if: github.event_name == 'push'
        run: nix build -L
